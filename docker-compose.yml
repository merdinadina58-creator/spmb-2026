# ============================================
# SPMB 2026 - docker-compose.yml untuk Production
# ============================================
# Database menggunakan Neon PostgreSQL (cloud)
# Jadi tidak perlu container database lokal

version: "3.8"

services:
  spmb-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spmb-2026
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
    # Jika butuh reverse proxy (nginx/caddy), uncomment:
    # networks:
    #   - spmb-network

